name: Smart Clock upstream sync

# Once a day: when Blueforcer/awtrix-ng published a release newer than the fork's base, merge its
# tag into sync/TAG, make it version X.Y.Z-sc.1 with the macOS build's base pinned to it, run CI on
# the branch, and when everything passes, fast-forward smartclock, tag vX.Y.Z-sc.1 and start the
# release workflow. A conflict or a failure opens an issue that says what to do instead.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: smartclock-sync
  cancel-in-progress: false

env:
  UPSTREAM: Blueforcer/awtrix-ng
  BRANCH: smartclock

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      # The workflow token cannot push an upstream release that changes .github/workflows; a
      # fine-grained token with contents and workflows write in SYNC_TOKEN can.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Look for a newer upstream release
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)
          base=$(tr -d '[:space:]' < version)
          base=${base%-sc.*}
          newer=$(python3 - "$latest" "$base" <<'PY'
          import re, sys
          parts = lambda v: tuple(int(n) for n in re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", v).groups())
          print("yes" if parts(sys.argv[1]) > parts(sys.argv[2]) else "no")
          PY
          )
          echo "upstream $latest, fork base $base, newer: $newer"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "release=v${latest#v}-sc.1" >> "$GITHUB_OUTPUT"
          echo "branch=sync/$latest" >> "$GITHUB_OUTPUT"
          if [ "$newer" != yes ]; then echo "newer=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          # One attempt per upstream release: an open issue or the branch of an earlier run stops it.
          if [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"Upstream $latest\" in:title" --json number -q '.[].number')" ] ||
             git ls-remote --exit-code --heads origin "sync/$latest" >/dev/null; then
            echo "an earlier sync of $latest is open; nothing to do"
            echo "newer=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "newer=yes" >> "$GITHUB_OUTPUT"

      - name: Merge the release
        id: merge
        if: steps.find.outputs.newer == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.find.outputs.tag }}
          RELEASE: ${{ steps.find.outputs.release }}
          SYNC: ${{ steps.find.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$TAG:refs/tags/$TAG"
          git checkout -b "$SYNC"
          if ! git merge --no-edit -m "Merge AWTRIX NG $TAG" "$TAG"; then
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "conflict=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${RELEASE#v}" > version
          python3 tools/tc002/macos/pin_base.py "$TAG"
          git commit -am "build: AWTRIX NG $TAG as the base of ${RELEASE#v}"
          git push origin "$SYNC"
          echo "conflict=no" >> "$GITHUB_OUTPUT"

      - name: Run CI on the merge
        id: ci
        if: steps.merge.outputs.conflict == 'no'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC: ${{ steps.find.outputs.branch }}
        run: |
          gh workflow run ci.yml --ref "$SYNC"
          run=""
          for _ in $(seq 60); do
            sleep 10
            run=$(gh run list --workflow ci.yml --branch "$SYNC" --event workflow_dispatch --limit 1 \
                  --json databaseId -q '.[0].databaseId // empty')
            [ -n "$run" ] && break
          done
          [ -n "$run" ] || { echo "::error::the CI run did not start"; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
          gh run watch "$run" --exit-status --interval 60

      - name: Release
        if: steps.ci.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.find.outputs.tag }}
          RELEASE: ${{ steps.find.outputs.release }}
          SYNC: ${{ steps.find.outputs.branch }}
        run: |
          git checkout "$BRANCH"
          git merge --ff-only "$SYNC"
          git push origin "$BRANCH"
          git tag -a "$RELEASE" -m "Smart Clock ${RELEASE#v} on AWTRIX NG $TAG"
          git push origin "$RELEASE"
          git push origin --delete "$SYNC"
          gh workflow run smartclock-release.yml --ref "$RELEASE"

      - name: Report a conflict
        if: steps.merge.outputs.conflict == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.find.outputs.tag }}
          RELEASE: ${{ steps.find.outputs.release }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Upstream $TAG does not merge cleanly" --body "$(cat <<EOF
          AWTRIX NG $TAG is out, and merging it into \`$BRANCH\` conflicts in:

          $(sed 's/^/- `/; s/$/`/' conflicts.txt)

          To do, on a checkout of the fork:

          \`\`\`sh
          git fetch https://github.com/$UPSTREAM.git refs/tags/$TAG:refs/tags/$TAG
          git checkout $BRANCH && git merge $TAG      # resolve, keep the Smart Clock changes
          echo ${RELEASE#v} > version
          python3 tools/tc002/macos/pin_base.py $TAG
          git commit -a && git push origin $BRANCH
          git tag -a $RELEASE -m "Smart Clock ${RELEASE#v}" && git push origin $RELEASE
          \`\`\`

          The tag starts the release workflow. Close this issue afterwards; while it is open, the daily sync leaves $TAG alone.
          EOF
          )"

      - name: Report a failure
        if: failure() && steps.find.outputs.newer == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.find.outputs.tag }}
          RELEASE: ${{ steps.find.outputs.release }}
          SYNC: ${{ steps.find.outputs.branch }}
          CI_RUN: ${{ steps.ci.outputs.run }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Upstream $TAG merged, but the checks fail" --body "$(cat <<EOF
          AWTRIX NG $TAG merged into \`$SYNC\` without conflicts, but the sync did not finish:
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID${CI_RUN:+ (CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CI_RUN)}

          To do:
          If the push of \`$SYNC\` was refused because the release changes \`.github/workflows\`, either add a
          fine-grained token with contents and workflows write as the secret \`SYNC_TOKEN\` and run the sync
          again, or do the merge on a checkout (see below).

          1. Check out \`$SYNC\` (or merge $TAG into \`$BRANCH\` yourself), fix what fails, push it and wait for CI to pass (\`gh workflow run ci.yml --ref $SYNC\`).
          2. Fast-forward \`$BRANCH\` to it, tag \`$RELEASE\` and push the tag; the tag starts the release workflow.
          3. Delete \`$SYNC\` and close this issue. While the issue is open or the branch exists, the daily sync leaves $TAG alone.
          EOF
          )"
